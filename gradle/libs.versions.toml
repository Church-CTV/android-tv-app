[versions]
compileSdk = "35"
minSdk = "25"
targetSdk = "35"
kotlin = "2.0.21"
androidGradle = "8.7.3"
material = "1.12.0"
composeBom = "2024.12.01"
composeMaterial3 = "1.3.1"
activityCompose = "1.10.1"
leanback = "1.0.0"
coreKtx = "1.15.0"
appcompat = "1.7.0"
lifecycle = "2.8.7"
navigationCompose = "2.8.9"
room = "2.6.1"
datastore = "1.1.2"
coroutines = "1.9.0"
exoplayer = "1.6.0"
media3 = "1.6.0"
retrofit = "2.11.0"
okhttp = "4.12.0"
coil = "2.7.0"
junit = "5.11.4"
espresso = "3.6.1"
composeTest = "1.7.8"
turbine = "1.2.0"
mockwebserver = "4.12.0"
truth = "1.5.0"
composeIcons = "1.7.8"
composeAnimation = "1.7.8"
junitVintage = "5.11.4"
robolectric = "4.14.1"
androidTest = "1.6.1"
androidTestRunner = "1.6.2"
testOrchestrator = "1.5.0"
junit4 = "4.13.2"
# Pinned separately for the test classpath: coroutines 1.9.0 changed StandardTestDispatcher
# from a top-level factory function to a class, which breaks the migrated test dispatchers.
# See the resolutionStrategy in app/build.gradle.kts (kept in sync).
coroutinesTest = "1.6.4"
kotlinxSerialization = "1.7.3"
detekt = "1.23.8"
ktlintGradle = "12.2.0"
dependencyCheck = "12.2.2"

[libraries]
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradle" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "composeMaterial3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-leanback = { group = "androidx.leanback", name = "leanback", version.ref = "leanback" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coil-svg = { group = "io.coil-kt", name = "coil-svg", version.ref = "coil" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version = "1.2.1" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "composeIcons" }
compose-animation = { group = "androidx.compose.animation", name = "animation", version.ref = "composeAnimation" }
junit-vintage = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitVintage" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidTest" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidTestRunner" }
test-orchestrator = { group = "androidx.test", name = "orchestrator", version.ref = "testOrchestrator" }
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }

[bundles]
core = ["androidx.core.ktx", "androidx.appcompat"]
compose = ["androidx.compose.ui", "androidx.compose.ui.graphics", "androidx.compose.ui.tooling-preview", "androidx.compose.material3", "androidx.activity.compose"]
lifecycle = ["androidx.lifecycle.viewmodel.compose", "androidx.lifecycle.runtime.compose", "androidx.lifecycle.viewmodel.ktx", "androidx.lifecycle.runtime.ktx"]
coroutines = ["kotlinx.coroutines.android"]
networking = ["retrofit", "retrofit.converter.serialization", "okhttp", "okhttp.logging"]
data = ["androidx.room.runtime", "androidx.room.ktx", "androidx.datastore.preferences"]
media = ["androidx.media3.exoplayer", "androidx.media3.exoplayer.hls", "androidx.media3.ui"]
images = ["coil.compose", "coil.svg"]
coroutines-test = ["kotlinx.coroutines.test", "turbine"]
test = ["junit.jupiter", "turbine", "mockwebserver", "truth"]
test-android = ["androidx.junit", "androidx.espresso.core"]

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradle" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.0.21-1.0.25" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependencyCheck" }
